<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | EzFirgi</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* Without this, a canvas taller than the visible browser viewport just
         runs off the bottom and the browser scrolls instead of clipping -
         this was the direct cause of buttons appearing "missing". */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=540 height=960 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">EzFirgi</div>
      </div>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebTest2.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebTest2.data",
        frameworkUrl: buildUrl + "/WebTest2.framework.js",
        codeUrl: buildUrl + "/WebTest2.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "EzFirgi",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      if (isMobile) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      // ---------------------------------------------------------------
      // Applies to BOTH desktop and mobile now. The old code hardcoded
      // the canvas to a fixed 540x960 on desktop, which overflows any
      // browser window shorter than 960px of visible viewport height
      // (very common once you subtract tabs / address bar). This instead
      // scales the canvas to fit whatever space is actually available,
      // while always preserving the real 1080x1920 design ratio via
      // letterboxing (black bars) so nothing is ever cropped or hidden.
      // ---------------------------------------------------------------
      function setRealViewportHeight() {
        container.style.height = window.innerHeight + "px";
      }

      function resizeCanvas() {
        var DESIGN_WIDTH = 1080;
        var DESIGN_HEIGHT = 1920;
        var aspectRatio = DESIGN_WIDTH / DESIGN_HEIGHT; // 0.5625, i.e. 9:16

        // MARGIN keeps the canvas from ever touching the literal window edges.
        // 0.96 = use at most 96% of the available space, leaving a ~2% buffer
        // on each side. Tune this up toward 1.0 for more game, or down for
        // more breathing room - just don't leave it at exactly 1.0.
        var MARGIN = 0.96;

        var maxHeight = window.innerHeight * MARGIN;
        var maxWidth = window.innerWidth * MARGIN;

        var height = maxHeight;
        var width = height * aspectRatio;

        if (width > maxWidth) {
          width = maxWidth;
          height = width / aspectRatio;
        }

        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
      }

      function handleViewportChange() {
        setRealViewportHeight();
        resizeCanvas();
      }

      handleViewportChange();
      window.addEventListener("resize", handleViewportChange);
      window.addEventListener("orientationchange", function () {
        handleViewportChange();
        setTimeout(handleViewportChange, 300);
      });

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
